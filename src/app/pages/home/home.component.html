<h2>Olympic games app</h2>
<hr/>
@if (loading) {
  <app-loading></app-loading>
} @else if (error) {
  <app-error-message [errorMessage]="errorMessage"></app-error-message>
} @else {
  <div class="dashboard">
    <app-title [titlePage]="titlePage" [metrics]="metrics"></app-title>
    <app-pie-chart [countries]="countries" [sumOfAllMedalsYears]="sumOfAllMedalsYears"></app-pie-chart>
  </div>
}
